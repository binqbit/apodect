[package]
name = "apodect-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "apodect-backend"

[dependencies]
actix-web = { version = "=4.19.0", default-features = false, features = ["macros"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros", "uuid", "chrono", "json"] }
tokio = { version = "=1.54.1", features = ["macros", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "tracing-log"] }
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
base64 = "=0.22.1"
hex = "=0.4.3"
sha2 = "=0.10.9"
bs58 = "=0.5.1"
uuid = { version = "=1.19.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
rand = "=0.8.8"
ed25519-dalek = "=2.2.0"
borsh = { version = "=1.8.1", features = ["derive"] }
rdkafka = { version = "=0.39.0", default-features = false, features = ["tokio"] }
near-crypto = "=0.38.0"
near-primitives = "=0.38.0"
alloy-primitives = { version = "=1.7.3", features = ["serde"] }
alloy-sol-types = "=1.7.3"
alloy-consensus = "=1.8.3"
alloy-eips = "=1.8.3"
alloy-signer = "=1.8.3"
alloy-signer-local = "=1.8.3"
apodect-solana = { path = "../../contracts/solana", features = ["no-entrypoint"] }
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v4", "token"] }
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-signer = "=3.0.1"
solana-signature = "=3.5.2"
solana-transaction = { version = "=4.3.0", features = ["wincode"] }
wincode = "=0.6.3"
