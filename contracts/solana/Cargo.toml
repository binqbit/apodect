[package]
name = "apodect-solana"
version = "1.0.0"
license = "MIT"
edition = "2021"
rust-version = "1.89"
description = "Locally funded Apodect Project contracts for Solana"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[[example]]
name = "localnet"
test = true

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = [
    "solana-v4",
    "token",
    "token_2022",
] }

solana-secp256k1-recover = "=3.3.1"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
spl-associated-token-account-interface = "=2.0.0"

[dev-dependencies]
k256 = { version = "=0.14.0", features = ["ecdsa"] }
base64 = "=0.22.1"
litesvm = "=0.18.2"
serde_json = "=1.0.154"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.3.0", features = ["wincode"] }
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
wincode = "=0.6.3"

[profile.release]
overflow-checks = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "no-log-ix-name"))',
] }
