[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = [
    "forge-std/=dependencies/forge-std-1.17.0/src/",
    "@openzeppelin/contracts/=dependencies/openzeppelin-contracts-5.6.1/contracts/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
