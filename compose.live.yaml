services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    ports: !reset []
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      target: production
    develop: !reset null
    ports: !reset []
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  frontend:
    build:
      target: production
    environment: !override
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your public hostname}
    volumes: !override
      - caddy_data:/data
      - caddy_config:/config
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
    logging: *logging

  localnet: !reset null

volumes:
  localnet_data: !reset null
  caddy_data:
  caddy_config:
