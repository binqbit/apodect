services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    ports: !reset []
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      target: production
    develop: !reset null
    ports: !reset []
    environment:
      APODECT_CONFIG: /run/secrets/deployment_config
      APODECT_REQUIRE_PUBLIC_PROVIDERS: "true"
      APP_ORIGIN: https://${SITE_ADDRESS:?Set SITE_ADDRESS to your public hostname}
      APODECT_SOLANA_CLUSTER: ${APODECT_SOLANA_CLUSTER:?Set the Solana cluster (mainnet, testnet or devnet)}
    volumes: !reset []
    secrets:
      - deployment_config
    depends_on: !override
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  worker:
    build:
      target: production
    develop: !reset null
    environment:
      APODECT_CONFIG: /run/secrets/deployment_config
      APODECT_REQUIRE_PUBLIC_PROVIDERS: "true"
      APODECT_ETHEREUM_RELAYER_KEY_FILE: /run/secrets/ethereum_relayer
      APODECT_SOLANA_RELAYER_KEY_FILE: /run/secrets/solana_relayer
      APODECT_NEAR_RELAYER_KEY_FILE: /run/secrets/near_relayer
      APODECT_NEAR_RELAYER_ACCOUNT: ${APODECT_NEAR_RELAYER_ACCOUNT:?Set the NEAR gas-payer account}
    volumes: !reset []
    secrets:
      - deployment_config
      - ethereum_relayer
      - solana_relayer
      - near_relayer
    depends_on: !override
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  frontend:
    build:
      target: production
    environment: !override
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your public hostname}
    volumes: !override
      - caddy_data:/data
      - caddy_config:/config
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
    logging: *logging

  localnet: !reset null

volumes:
  localnet_data: !reset null
  backend_runtime: !reset null
  caddy_data:
  caddy_config:

secrets:
  deployment_config:
    file: ${APODECT_DEPLOYMENT_FILE:-./.secrets/deployment.json}
  ethereum_relayer:
    file: ${APODECT_ETHEREUM_RELAYER_FILE:-./.secrets/ethereum-relayer.key}
  solana_relayer:
    file: ${APODECT_SOLANA_RELAYER_FILE:-./.secrets/solana-relayer.json}
  near_relayer:
    file: ${APODECT_NEAR_RELAYER_FILE:-./.secrets/near-relayer.json}
